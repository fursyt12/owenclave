name: Desktop Build
on:
  push:
    branches:
      - dev*
    paths:
      - "desktop/**"
      - "app/src/main/java/io/nekohasekai/sagernet/fmt/**"
      - "app/src/main/java/io/nekohasekai/sagernet/group/**"
      - "app/src/main/java/io/nekohasekai/sagernet/ktx/**"
      - "buildSrc/**"
      - "bin/desktop/**"
      - "gradle/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
    inputs:
      release:
        description: 'Release (y/n)'
        required: false
      tag:
        description: 'Release Tag'
        required: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            target: linux/amd64
            artifact: linux-x64
          - name: macOS x64
            os: macos-15-intel
            target: darwin/amd64
            artifact: macos-x64
          - name: macOS arm64
            os: macos-14
            target: darwin/arm64
            artifact: macos-arm64
          - name: Windows x64
            os: windows-latest
            target: windows/amd64
            artifact: windows-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.0
          cache-dependency-path: "library/core/go.sum"
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Install WiX (Windows MSI)
        if: runner.os == 'Windows'
        run: choco install wixtoolset --no-progress -y
      - name: Warm Go module cache
        shell: bash
        env:
          # `|` lets Go fall back on any proxy error, not only on 404/410;
          # proxy.golang.org occasionally fails mid download with INTERNAL_ERROR.
          GOPROXY: "https://proxy.golang.org|https://goproxy.io|direct"
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4; do
            echo "::group::go mod download (attempt $attempt)"
            if (cd library/core && go mod download); then
              echo "module cache is warm"
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed, retrying in 20s"
            sleep 20
          done
          echo "::error::go mod download failed after 4 attempts"
          exit 1
      - name: Build core
        shell: bash
        env:
          GOPROXY: "https://proxy.golang.org|https://goproxy.io|direct"
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if TARGETS="${{ matrix.target }}" bash bin/desktop/core/build.sh; then
              exit 0
            fi
            echo "core build attempt $attempt failed, retrying in 20s"
            sleep 20
          done
          echo "::error::core build failed after 3 attempts"
          exit 1
      - name: Download NaiveProxy
        shell: bash
        run: TARGETS="${{ matrix.target }}" bash bin/desktop/naive/download.sh
      - name: Verify binaries
        shell: bash
        run: |
          tag="${{ matrix.target }}"
          tag="${tag//\//-}"
          ls -la "desktop/core/dist/$tag" "desktop/naive/dist/$tag"
      - name: Gradle cache
        uses: actions/cache@v6
        with:
          path: ~/.gradle
          key: gradle-desktop-${{ matrix.artifact }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
      - name: Unit tests (importers + config builder)
        shell: bash
        run: ./gradlew :desktop:app:test :desktop:shared:test --console=plain
      - name: macOS jpackage probe
        if: runner.os == 'macOS'
        shell: bash
        continue-on-error: true
        run: |
          set +e
          work=/tmp/jpprobe; rm -rf "$work"; mkdir -p "$work/in"
          cp desktop/app/build/libs/app.jar "$work/in/"
          "$JAVA_HOME/bin/jpackage" --type app-image --input "$work/in" \
            --main-jar app.jar --main-class io.nekohasekai.sagernet.desktop.MainKt \
            --name Probe --app-version 1.0.0 --dest "$work/out" > "$work/probe.log" 2>&1
          rc=$?
          echo "::notice::jpackage probe exit code $rc"
          tail -25 "$work/probe.log" | while IFS= read -r line; do echo "::error::jpackage-probe $line"; done
          exit 0
      - name: Build portable archive and application image
        shell: bash
        run: |
          set -uo pipefail
          # CI logs need a token, annotations do not: surface Gradle failures as
          # annotations so a broken packaging step can be diagnosed from the API.
          report() {
            local label="$1" log="$2"
            echo "::error::$label failed"
            grep -aE "What went wrong|Execution failed|Caused by|^> |FAILURE|error:|Error:|Exception" "$log" \
              | head -12 | while IFS= read -r line; do
                echo "::error::${line//$'\r'/}"
              done
          }
          df -h | head -5 | while IFS= read -r line; do echo "::notice::disk $line"; done
          dump_jpackage() {
            local dir="$1" tag="$2"
            local f
            for f in "$dir"/*-err.txt "$dir"/*-out.txt; do
              [ -f "$f" ] || continue
              echo "::error::[$tag] $(basename "$f")"
              head -25 "$f" | while IFS= read -r line; do echo "::error::[$tag] $line"; done
            done
          }
          dump_args() {
            local f="$1"
            [ -f "$f" ] || return 0
            tr -s ' ' '\n' < "$f" | grep -v '^$' | head -60 | while IFS= read -r line; do
              echo "::error::jpackage-arg $line"
            done
          }
          echo "--- createDistributable ---"
          if ! ./gradlew :desktop:app:createDistributable --console=plain > /tmp/create.log 2>&1; then
            tail -30 /tmp/create.log
            dump_jpackage desktop/app/build/compose/logs/createDistributable create
            dump_args desktop/app/build/compose/tmp/createDistributable.args.txt
            report "createDistributable" /tmp/create.log
            exit 1
          fi
          tail -3 /tmp/create.log
          echo "--- packagePortable ---"
          if ! ./gradlew :desktop:app:packagePortable --console=plain > /tmp/portable.log 2>&1; then
            tail -30 /tmp/portable.log
            dump_jpackage desktop/app/build/compose/logs/createDistributable create
            report "packagePortable" /tmp/portable.log
            exit 1
          fi
          tail -3 /tmp/portable.log
      - name: Development self test (core tunnel)
        shell: bash
        run: ./gradlew :desktop:app:run --args="--selftest" --console=plain
      - name: Packaged self test (bundled core tunnel)
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then name="Owenclave.exe"; else name="Owenclave"; fi
          launcher="$(find desktop/app/build/compose/binaries/main/app -maxdepth 4 -type f -name "$name" | sort | head -1)"
          echo "launcher: $launcher"
          "$launcher" --version
          "$launcher" --selftest
      - name: NaiveProxy plugin self test
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then name="Owenclave.exe"; else name="Owenclave"; fi
          launcher="$(find desktop/app/build/compose/binaries/main/app -maxdepth 4 -type f -name "$name" | sort | head -1)"
          "$launcher" --selftest-naive
      - name: Package installer (best effort)
        shell: bash
        continue-on-error: true
        run: ./gradlew :desktop:app:packageDistributionForCurrentOS --console=plain
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: owenclave-desktop-${{ matrix.artifact }}
          path: desktop/app/build/compose/binaries/main/**
          if-no-files-found: warn
      - name: Upload platform binaries
        uses: actions/upload-artifact@v7
        with:
          name: owenclave-binaries-${{ matrix.artifact }}
          path: |
            desktop/core/dist/${{ matrix.target }}
            desktop/naive/dist/${{ matrix.target }}
          if-no-files-found: warn

  publish:
    name: Publish Release
    if: github.event.inputs.release == 'y' && github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    needs: build
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Publish Release
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.zip" -o -name "*.dmg" -o -name "*.msi" -o -name "*.deb" -o -name "*.rpm" \) -exec cp {} release/ \;
          ls -la release
          gh release create --latest=false "${{ github.event.inputs.tag }}" --notes="" --title="${{ github.event.inputs.tag }}" ./release/*
