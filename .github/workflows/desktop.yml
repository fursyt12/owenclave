name: Desktop Build
on:
  push:
    branches:
      - dev*
    paths:
      - "desktop/**"
      - "app/src/main/java/io/nekohasekai/sagernet/fmt/**"
      - "app/src/main/java/io/nekohasekai/sagernet/group/**"
      - "app/src/main/java/io/nekohasekai/sagernet/ktx/**"
      - "buildSrc/**"
      - "bin/desktop/**"
      - "gradle/**"
      - ".github/workflows/desktop.yml"
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      release:
        description: 'Release (y/n)'
        required: false
      tag:
        description: 'Release Tag'
        required: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            target: linux/amd64
            artifact: linux-x64
            tag: linux-amd64
          - name: macOS x64
            os: macos-15-intel
            target: darwin/amd64
            artifact: macos-x64
            tag: darwin-amd64
          - name: macOS arm64
            os: macos-14
            target: darwin/arm64
            artifact: macos-arm64
            tag: darwin-arm64
          - name: Windows x64
            os: windows-latest
            target: windows/amd64
            artifact: windows-x64
            tag: windows-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.0
          cache-dependency-path: "library/core/go.sum"
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Install WiX (Windows MSI)
        if: runner.os == 'Windows'
        run: choco install wixtoolset --no-progress -y
      - name: Warm Go module cache
        shell: bash
        env:
          # `|` lets Go fall back on any proxy error, not only on 404/410;
          # proxy.golang.org occasionally fails mid download with INTERNAL_ERROR.
          GOPROXY: "https://proxy.golang.org|https://goproxy.io|direct"
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4; do
            echo "::group::go mod download (attempt $attempt)"
            if (cd library/core && go mod download); then
              echo "module cache is warm"
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed, retrying in 20s"
            sleep 20
          done
          echo "::error::go mod download failed after 4 attempts"
          exit 1
      - name: Build core
        shell: bash
        env:
          GOPROXY: "https://proxy.golang.org|https://goproxy.io|direct"
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if TARGETS="${{ matrix.target }}" bash bin/desktop/core/build.sh; then
              exit 0
            fi
            echo "core build attempt $attempt failed, retrying in 20s"
            sleep 20
          done
          echo "::error::core build failed after 3 attempts"
          exit 1
      - name: Download NaiveProxy
        shell: bash
        run: TARGETS="${{ matrix.target }}" bash bin/desktop/naive/download.sh
      - name: Download tun2socks (transparent mode)
        shell: bash
        run: TARGETS="${{ matrix.target }}" bash bin/desktop/tun2socks/download.sh
      - name: Build olcrtc plugin
        shell: bash
        env:
          GOPROXY: "https://proxy.golang.org|https://goproxy.io|direct"
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if TARGETS="${{ matrix.target }}" bash bin/desktop/olcrtc/build.sh; then
              exit 0
            fi
            echo "olcrtc build attempt $attempt failed, retrying in 20s"
            sleep 20
          done
          echo "::error::olcrtc build failed after 3 attempts"
          exit 1
      - name: Verify binaries
        shell: bash
        run: |
          tag="${{ matrix.target }}"
          tag="${tag//\//-}"
          ls -la "desktop/core/dist/$tag" "desktop/naive/dist/$tag" "desktop/olcrtc/dist/$tag" "desktop/tun2socks/dist/$tag"
      - name: Gradle cache
        uses: actions/cache@v6
        with:
          path: ~/.gradle
          key: gradle-desktop-${{ matrix.artifact }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
      - name: Build the Arch package and repository
        if: runner.os == 'Linux' && matrix.tag == 'linux-amd64'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :desktop:app:createDistributable --console=plain
          docker run --rm -v "$PWD":/work -w /work archlinux:latest bash -c "
            pacman -Sy --noconfirm --needed base-devel >/dev/null &&
            bash bin/desktop/arch/package.sh
          "
          sudo chown -R "$(id -u):$(id -g)" desktop/arch
          ls -la desktop/arch/dist
      - name: Unit tests (importers + config builder)
        shell: bash
        run: ./gradlew :desktop:app:test :desktop:shared:test --console=plain
      - name: macOS jpackage probe
        if: runner.os == 'macOS'
        shell: bash
        continue-on-error: true
        run: |
          set +e
          work=/tmp/jpprobe; rm -rf "$work"; mkdir -p "$work/in"
          cp desktop/app/build/libs/app.jar "$work/in/"
          "$JAVA_HOME/bin/jpackage" --type app-image --input "$work/in" \
            --main-jar app.jar --main-class io.nekohasekai.sagernet.desktop.MainKt \
            --name Probe --app-version 1.0.0 --dest "$work/out" > "$work/probe.log" 2>&1
          rc=$?
          echo "::notice::jpackage probe exit code $rc"
          tail -25 "$work/probe.log" | while IFS= read -r line; do echo "::error::jpackage-probe $line"; done
          exit 0
      - name: Build portable archive and application image
        shell: bash
        run: |
          set -uo pipefail
          # CI logs need a token, annotations do not: surface Gradle failures as
          # annotations so a broken packaging step can be diagnosed from the API.
          source bin/desktop/ci-report.sh
          echo "--- createDistributable ---"
          if ! ./gradlew :desktop:app:createDistributable --console=plain > /tmp/create.log 2>&1; then
            tail -30 /tmp/create.log
            dump_jpackage_logs desktop/app/build/compose/logs
            dump_jpackage_args desktop/app/build/compose/tmp/createDistributable.args.txt
            report_gradle_failure "createDistributable" /tmp/create.log
            exit 1
          fi
          tail -3 /tmp/create.log
          echo "--- packagePortable ---"
          if ! ./gradlew :desktop:app:packagePortable --console=plain > /tmp/portable.log 2>&1; then
            tail -30 /tmp/portable.log
            dump_jpackage_logs desktop/app/build/compose/logs
            report_gradle_failure "packagePortable" /tmp/portable.log
            exit 1
          fi
          tail -3 /tmp/portable.log
      - name: Verify the bundled runtime
        shell: bash
        run: |
          set -uo pipefail
          # The binaries are staged into the application jar under bin/: a missing
          # download step used to ship an application without tun2socks, which only
          # showed up as a silent transparent mode failure, so it is asserted here.
          jar="$(find desktop/app/build/compose/binaries/main/app -type f -name 'app-*.jar' | head -1)"
          echo "application jar: $jar"
          listing=""
          if command -v unzip >/dev/null 2>&1; then
            listing="$(unzip -Z1 "$jar" | grep -a '^bin/' || true)"
          fi
          if [ -z "$listing" ] && command -v python3 >/dev/null 2>&1; then
            listing="$(python3 -c 'import sys,zipfile;print("\n".join(n for n in zipfile.ZipFile(sys.argv[1]).namelist() if n.startswith("bin/")))' "$jar" 2>/dev/null || true)"
          fi
          if [ -z "$listing" ]; then
            echo "::error::cannot read the contents of $jar"
            exit 1
          fi
          printf '%s\n' "$listing"
          missing=0
          for name in owenclave-core naive olcrtc tun2socks; do
            fileName="$name"
            if [ "$RUNNER_OS" = "Windows" ]; then fileName="$name.exe"; fi
            if ! printf '%s\n' "$listing" | grep -qx "bin/$fileName"; then
              echo "::error::bin/$fileName is missing from the application image"
              missing=1
            fi
          done
          if [ "$RUNNER_OS" = "Windows" ] && ! printf '%s\n' "$listing" | grep -qx 'bin/wintun.dll'; then
            echo "::warning::bin/wintun.dll is missing: transparent mode on Windows needs it next to the launcher"
          fi
          exit "$missing"
      - name: Development self test (core tunnel)
        shell: bash
        run: ./gradlew :desktop:app:run --args="--selftest" --console=plain
      - name: Packaged self test (bundled core tunnel)
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then name="Owenclave.exe"; else name="Owenclave"; fi
          launcher="$(find desktop/app/build/compose/binaries/main/app -maxdepth 4 -type f -name "$name" | sort | head -1)"
          echo "launcher: $launcher"
          "$launcher" --version
          "$launcher" --selftest
      - name: Protocol self tests (bundled core, every protocol family)
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then name="Owenclave.exe"; else name="Owenclave"; fi
          launcher="$(find desktop/app/build/compose/binaries/main/app -maxdepth 4 -type f -name "$name" | sort | head -1)"
          # starts the shipped core as a local server per protocol and tunnels a
          # request through the config the shared Android generator produced
          "$launcher" --selftest-protocols
      - name: NaiveProxy plugin self test
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then name="Owenclave.exe"; else name="Owenclave"; fi
          launcher="$(find desktop/app/build/compose/binaries/main/app -maxdepth 4 -type f -name "$name" | sort | head -1)"
          "$launcher" --selftest-naive
      - name: Transparent mode self test (network namespace, informational)
        if: runner.os == 'Linux'
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          launcher="$(find desktop/app/build/compose/binaries/main/app -maxdepth 4 -type f -name 'Owenclave' | head -1)"
          echo "launcher: $launcher"
          mkdir -p /tmp/owenclave-netns
          log=/tmp/tun-netns.log
          # a network namespace gives CAP_NET_ADMIN for the TUN device without
          # touching the runner's own routes. GitHub runs this step as `bash -e`,
          # so the status goes through an if: a bare `sudo ...` that fails aborted
          # the step before any diagnostic below could run.
          status=0
          if ! sudo unshare -rn bash -c "
            ip link set lo up
            ip route add default dev lo || true
            export JAVA_TOOL_OPTIONS=-Dowenclave.dataDir=/tmp/owenclave-netns
            '$launcher' --selftest-tun-stub
          " >"$log" 2>&1; then
            status=$?
          fi
          echo "::notice::transparent mode, network namespace: launcher exit status $status"
          # the job logs need a token, annotations do not: publish the end of the
          # log either way so a failure here can be diagnosed from the API
          if [ ! -s "$log" ]; then
            echo "::warning::transparent mode, network namespace: the launcher wrote nothing to stderr or stdout; unshare=$(command -v unshare || echo missing) sudo=$(command -v sudo || echo missing)"
          fi
          tail -20 "$log" | while IFS= read -r line; do echo "::notice::tun-netns-log $line"; done
          if grep -q '\[selftest-tun\] PASS' "$log"; then
            echo "::notice::transparent mode, network namespace: PASS"
          else
            # informational only: the namespace of the hosted runner produces no
            # output at all here, while the real run below passes on Linux and both
            # macOS builds and is the check that counts
            echo "::notice::transparent mode, network namespace: inconclusive on this runner (informational; the real run below is authoritative)"
            grep -aE 'selftest-tun|Exception|denied|No such|not found' "$log" | tail -8 | while IFS= read -r line; do
              echo "::notice::tun-netns $line"
            done
          fi
          exit 0
      - name: Package installer (best effort)
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          source bin/desktop/ci-report.sh
          if ./gradlew :desktop:app:packageDistributionForCurrentOS --console=plain > /tmp/installer.log 2>&1; then
            tail -5 /tmp/installer.log
            find desktop/app/build/compose/binaries/main -maxdepth 2 -type f \
              \( -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o -name '*.msi' -o -name '*.pkg' \) \
              | while IFS= read -r file; do echo "::notice::installer $file"; done
          else
            tail -25 /tmp/installer.log
            dump_jpackage_logs desktop/app/build/compose/logs
            report_gradle_failure "packageDistributionForCurrentOS" /tmp/installer.log
          fi
          exit 0
      - name: Upload the Arch repository
        if: runner.os == 'Linux' && matrix.tag == 'linux-amd64'
        uses: actions/upload-artifact@v7
        with:
          name: owenclave-arch-repo
          path: desktop/arch/dist/**
          if-no-files-found: warn
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: owenclave-desktop-${{ matrix.artifact }}
          path: desktop/app/build/compose/binaries/main/**
          if-no-files-found: warn
      - name: Upload platform binaries
        uses: actions/upload-artifact@v7
        with:
          name: owenclave-binaries-${{ matrix.artifact }}
          path: |
            desktop/core/dist/${{ matrix.tag }}
            desktop/naive/dist/${{ matrix.tag }}
            desktop/olcrtc/dist/${{ matrix.tag }}
          if-no-files-found: warn
      # Runs last: it takes over the default route, so it must not be able to
      # jeopardise the artifact uploads. Needs administrator rights, which the
      # runners provide.
      - name: Transparent mode self test (real, takes over the default route)
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          # `timeout` is not available on every runner, a watchdog is portable
          run_with_timeout() {
            local secs="$1"; shift
            "$@" &
            local pid=$!
            ( sleep "$secs"; kill -9 "$pid" 2>/dev/null ) &
            local watcher=$!
            wait "$pid"
            local rc=$?
            kill "$watcher" 2>/dev/null || true
            return $rc
          }
          if [ "${RUNNER_OS}" = "Windows" ]; then
            launcher="$(find desktop/app/build/compose/binaries/main/app -maxdepth 4 -type f -name 'Owenclave.exe' | head -1)"
          else
            launcher="$(find desktop/app/build/compose/binaries/main/app -maxdepth 4 -type f -name 'Owenclave' | head -1)"
          fi
          echo "launcher: $launcher"
          log=/tmp/tun-real.log
          # TUN needs administrator rights, and the runners grant them through sudo
          if [ "${RUNNER_OS}" = "Windows" ]; then
            run_with_timeout 180 "$launcher" --selftest-tun >"$log" 2>&1 || true
          else
            run_with_timeout 180 sudo -E "$launcher" --selftest-tun >"$log" 2>&1 || true
          fi
          tail -25 "$log"
          if grep -q '\[selftest-tun\] PASS' "$log"; then
            echo "::notice::transparent mode, real run: PASS"
          else
            echo "::warning::transparent mode, real run: did not pass"
            grep -aE 'selftest-tun|Exception|denied|failed|error' "$log" | tail -10 | while IFS= read -r line; do
              echo "::warning::tun-real $line"
            done
          fi
          exit 0

  publish:
    name: Publish Release
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'y' && github.event.inputs.tag != '')
    runs-on: ubuntu-latest
    needs: build
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Collect assets and write release notes
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "TAG=${GITHUB_REF_NAME}" >>"$GITHUB_ENV"
          else
            echo "TAG=${{ github.event.inputs.tag }}" >>"$GITHUB_ENV"
          fi
          version="$(grep -E '^VERSION_NAME=' version.properties | cut -d= -f2 | tr -d '[:space:]')"
          desktop_version="$(printf '%s' "$version" | sed -E 's/^0+(\.)/1\1/')"
          echo "VERSION=${version}" >>"$GITHUB_ENV"
          echo "DESKTOP_VERSION=${desktop_version}" >>"$GITHUB_ENV"
          rm -rf release notes.md
          mkdir -p release
          # Installer names do not contain the platform, so the macOS dmg of both
          # architectures would overwrite each other: suffix them with the matrix tag
          # taken from the artifact directory name. Portable archives already carry
          # the os and the architecture.
          while IFS= read -r file; do
            rel="${file#artifacts/}"
            leg="${rel%%/*}"
            short="${leg#owenclave-desktop-}"
            base="$(basename "$file")"
            case "$base" in
              *-portable.zip) target="$base" ;;
              *) target="${base%.*}-${short}.${base##*.}" ;;
            esac
            cp "$file" "release/$target"
          done < <(find artifacts -type f \( -name "*.zip" -o -name "*.dmg" -o -name "*.msi" -o -name "*.deb" -o -name "*.rpm" \) | sort)
          # the Arch repository files must keep their exact names: pacman asks for
          # <repo>.db and for the package file inside the repository
          mkdir -p arch
          find artifacts/owenclave-arch-repo -type f -name '*.pkg.tar.zst' -exec cp {} release/ \; 2>/dev/null || true
          find artifacts/owenclave-arch-repo -type f \( -name '*.pkg.tar.zst' -o -name 'owenclave.db*' -o -name 'owenclave.files*' \) -exec cp {} arch/ \; 2>/dev/null || true
          count=$(find release -type f | wc -l)
          echo "collected $count asset(s) for ${TAG:-manual}"
          ls -la arch 2>/dev/null || true
          ls -la release
          test "$count" -gt 0
          cat > notes.md <<'NOTES'
          Desktop client for macOS, Windows and Linux. It reuses the Android protocol
          layer and runs the same Go engine as a child process, so profiles, share
          links, Clash YAML and V2Ray/sing-box JSON behave exactly like on Android.

          Built from the Android app version `__VERSION__`; desktop packages use the
          version `__DESKTOP_VERSION__`.

          ## Downloads

          | Platform | Portable (unpack and run) | Installer |
          | --- | --- | --- |
          | Windows x64 | `owenclave-desktop-__DESKTOP_VERSION__-windows-amd64-portable.zip` | `Owenclave-__DESKTOP_VERSION__-windows-x64.msi` |
          | macOS arm64 | `owenclave-desktop-__DESKTOP_VERSION__-darwin-arm64-portable.zip` | `Owenclave-__DESKTOP_VERSION__-macos-arm64.dmg` |
          | macOS x64 | `owenclave-desktop-__DESKTOP_VERSION__-darwin-amd64-portable.zip` | `Owenclave-__DESKTOP_VERSION__-macos-x64.dmg` |
          | Linux x64 | `owenclave-desktop-__DESKTOP_VERSION__-linux-amd64-portable.zip` | `owenclave___DESKTOP_VERSION___amd64-linux-x64.deb`, `owenclave-__DESKTOP_VERSION__-1.x86_64-linux-x64.rpm` |

          The portable archive is self contained: unpack it, start the launcher, and
          profiles, settings plus the extracted `owenclave-core`, `naive`, `olcrtc` and
          `tun2socks` engines stay inside the unpacked folder as long as a `data`
          directory sits next to the launcher (remove it to fall back to the per user OS
          directory).

          ## Verified on every build

          * unit tests of the shared subscription importers and the desktop config builder
          * every generated protocol config is fed to `owenclave-core test`, including the
            client only protocols, so a protocol the engine cannot parse fails the build
          * tunnel smoke test through the core bundled into the application image
          * protocol self tests that start the shipped core as a local server and tunnel a
            request through VLESS, VMess, Trojan, AnyTLS, Shadowsocks, SOCKS and HTTP
          * settings parity: the catalog is parsed from the Android preference XML (seven
            categories, 86 preferences) and a changed setting has to change the generated
            config, so a binding that stores a value without applying it fails the build
          * nine Android preferences that used to be disabled now have desktop
            behaviour: auto connect, night theme, HWID reset, the insecure profile
            warning, the server address line, the local DNS inbound with its port and
            the IPv6 address plus split default routes on the TUN device; the Android service
            mode maps onto the desktop transparent mode and the VPN interface IPv6
            switch adds the IPv6 routes to the tunnel device
          * NaiveProxy plugin test that starts the real `naive` binary and lets the core dial in
          * transparent mode test: `tun2socks` creates a TUN device inside a network
            namespace, the client's traffic enters it and reaches a stub SOCKS server,
            followed by a real run that takes over the default route on each system
            (informational: the second one is skipped when the runner refuses
            administrator rights, and it never blocks the build)

          Every push builds and tests all four targets: Linux x64, Windows x64,
          macOS arm64 and macOS x64.

          ## Notes

          * The macOS bundles are not signed with an Apple certificate, so Gatekeeper
            asks once: right click then Open, or `xattr -dr com.apple.quarantine <app>`.
          * Desktop package versions use the scheme `1.a.b` for the Android app version
            `0.a.b`, because jpackage refuses an app version whose first component is zero
            on macOS.
          * Transparent mode (TUN) needs root, or administrator on Windows, where
            `wintun.dll` must sit next to the launcher. When the device cannot be
            created the connection log says which right or file is missing, and the
            application states the reason instead of failing silently.
          * The settings menu is generated from the Android preference definition as well,
            so the same seven categories and 86 preferences appear here, in the same order,
            with the Android titles, summaries and defaults; the entries that cannot work
            without a VpnService (service mode, per-app proxy, notifications, Tasker, ...)
            stay visible but disabled and say why.
          * Service mode chooses between the transparent TUN device, the operating system
            proxy (GNOME/KDE settings, macOS `networksetup`, Windows WinINet; the previous
            values are backed up and restored) and the local SOCKS listener only. Per-app
            routing is implemented on Linux (cgroup v2 plus nftables marks and policy
            routing) and is explicitly unavailable on Windows and macOS, where it would
            need a WFP callout driver or a NetworkExtension.
          * Protocol coverage matches the Android app: the desktop client generates its
            configuration with the very same generator Android uses, so Shadowsocks
            (incl. 2022 and SIP003 plugins), VMess, VLESS, Trojan, Hysteria2, TUIC,
            Juicity, AnyTLS, Mieru, Snell, SSH, ShadowQUIC, TrustTunnel, HTTP/3,
            WireGuard and SOCKS/HTTP are all usable. NaiveProxy and OLCRTC run as
            external engines, exactly like the plugins on Android. See
            `desktop/README.md`.
          NOTES
          sed -i "s/__VERSION__/${version}/g; s/__DESKTOP_VERSION__/${desktop_version}/g" notes.md
          echo "--- release notes ---"
          cat notes.md
      - name: Publish or update the release
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "updating the existing release $TAG"
            gh release upload "$TAG" ./release/* --clobber
            gh release edit "$TAG" --title "Owenclave desktop ${DESKTOP_VERSION}" --notes-file notes.md --latest=false
            # drop assets that belonged to an earlier layout of this release
            while IFS= read -r asset; do
              [ -f "release/$asset" ] || gh release delete-asset "$TAG" "$asset" --yes
            done < <(gh release view "$TAG" --json assets --jq '.assets[].name')
          else
            gh release create --latest=false "$TAG" \
              --title "Owenclave desktop ${DESKTOP_VERSION}" \
              --notes-file notes.md \
              ./release/*
          fi
          gh release view "$TAG"

          # Stable repository release: the URL used by the one command installer and
          # by the Server line in /etc/pacman.conf never changes.
          if [ -n "$(ls -A arch 2>/dev/null)" ]; then
            if ! gh release view desktop-repo >/dev/null 2>&1; then
              gh release create desktop-repo --latest=false --title "Arch repository" \
                --notes "pacman repository for owenclave-desktop.\n\nInstall with:\n\n    sudo bash -c \"\$(curl -fsSL https://raw.githubusercontent.com/fursyt12/owenclave/dev/packaging/arch/setup-repo.sh)\""
            fi
            gh release upload desktop-repo ./arch/* --clobber
            echo "uploaded the Arch repository assets"
          fi
