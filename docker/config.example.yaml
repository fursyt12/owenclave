# Mihomo-compatible configuration for Owenclave Docker / daemon mode
mixed-port: 7890
tproxy-port: 0
allow-lan: true
bind-address: "0.0.0.0"
mode: rule
log-level: info
ipv6: true

# Automatically fall back to direct (`bypass`) if ALL proxy servers are unreachable,
# preventing LAN internet and DNS outages during upstream server downtime.
fallback-to-direct: true

# Mihomo REST API + built-in Owenclave Web Console (/ui/)
external-controller: 0.0.0.0:9090
secret: ""

# Optional outbound physical interface pin (e.g. enp7s0 on multi-NIC routers)
# interface-name: enp7s0

# Optional remote subscriptions (Remnawave, Mihomo YAML, base64 share links, happ://)
# subscriptions:
#   - name: Main
#     url: https://example.com/sub/token

proxies: []
proxy-groups:
  - name: "Auto-Failover"
    type: fallback
    include-all: true
    url: "http://cp.cloudflare.com/generate_204"
    interval: 15
    fallback-to-direct: true
  - name: "PROXY"
    type: select
    proxies:
      - "Auto-Failover"
      - "DIRECT"
rules:
  - GEOIP,private,DIRECT,no-resolve
  - MATCH,PROXY

